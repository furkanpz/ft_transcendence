<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PONG</title>
    <style>
      :root {
        --color-primary: #222222;
        --color-secondary: #000000;
        --color-accent: #1DCD9F;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--color-secondary);
      }
      img {
        width: 100%;
      }
      .app {
        display: flex;
        flex-direction: column;
      }
      .footer {
        background-color: var(--color-primary);
        color: var(--color-accent);
        text-align: center;
        position: absolute;
        box-sizing: border-box;
        bottom: 0;
        width: 100%;
      }
      .top-bar {
        background-color: var(--color-primary);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: absolute relative;
        box-sizing: border-box;
        width: 100%;
        top: 0;
        padding: 20px;
      }
      /* Entry Page Styles */
      .entry-page {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-evenly;
        padding: 80px;
        gap: 80px;
      }
      .text-container, .img-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        flex: 1;
        min-width: 250px;
        max-width: 500px;
        color: var(--color-accent);
        background-color: var(--color-primary);
        text-align: center;
        border: solid 3px var(--color-accent);
        border-radius: 10px;
        aspect-ratio: 1 / 1;
      }
      /* Login Input Styles */
      .login-input {
        border-style: hidden;
        border-radius: 1ch;
        width: 25ch;
        height: 4ch;
      }
      .login-button {
        text-align: center;
        border-style: hidden;
        border-radius: 1ch;
        width: 15ch;
        height: 4ch;
      }
      .login-area {
        /* display: none; */
        flex-direction: column;
        align-items: center;
        margin-top: 5px;
        gap: 10px;
      }
      .canvas-container {
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        object-fit: cover;
      }
      .logo {
        color: var(--color-accent);
        width: 50px;
      }
    </style>
    <script type="module" src="out/entry.page.js"></script>
    <script type="module" src="out/main.js"></script>
  </head>
  <body>
    <div id="app" class="app">
      <div id="top-bar" class="top-bar">
        <img class="logo" src="/src/assets/logo.png" alt="Logo"/>
        <button id="playButton" class="login-button">
          Play
        </button>
        <button id="loginButton" class="login-button" onclick="loadLoginPage()">
          Login
        </button>
      </div>
      <div id="entry-page" class="entry-page">
        <div class="text-container">
          <h1>Welcome to the Game!!!</h1>
          <p>Click "Play" to start or "Login" to access your account.</p>
        </div>
        <div class="img-container">
          <img src="Untitled.png" style="border-radius: 1ch;" alt="Game Image"/>
        </div>
      </div>
      <div id="footer" class="footer">
        <p style="text-align: center;">Made with ❤️ by Your Name</p>
      </div>
    </div>
  </body>
</html>
