<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      .main {
        display: flex;
        flex-direction: row;
        align-items: start;
        justify-content: center;
        margin-bottom: 50px;
        gap: 12px;
      }
      .list {
        list-style-type: none;
      }
      .test {
        border-color: red;
        width: 50px;
        height: 50px;
      }
      body {
        background-color: rgb(54, 59, 78);
      }
      .login-input {
        border-style: hidden;
        border-radius: 1ch;
        width: 25ch;
        height: 4ch;
      }
      .login-button {
        text-align: center;
        border-style: hidden;
        border-radius: 1ch;
        width: 25ch;
        height: 4ch;
      }
      .login-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
    </style>
    <script src="../out/frontend/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="buttons" class="main">
        <li class="list">
          <button class="test"></button>
        </li>
        <li class="list">
          <button class="test"></button>
        </li>
        <li class="list">
          <button class="test"></button>
        </li>
      </div>
      <div id="login" class="login-area">
        <input id="email" class="login-input" type="email"/>
        <input id="password" class="login-input" type="password"/>
        <button id="login" class="login-button" onclick="login();">Login</button>
      </div>
    </div>
  </body>
</html>
