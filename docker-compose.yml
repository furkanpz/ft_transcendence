services:
  backend:
    container_name: backend
    build: ./src/
    ports:
      - 3000:3000
      - 5173:5173
    volumes:
      - ./src/frontend:/frontend:rw
      - ./data/db:/backend/db:rw
      - ./uploads:/backend/uploads:rw
      - /frontend/node_modules
      - /backend/node_modules
    env_file:
      - .env


    